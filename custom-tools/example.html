<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extensión de prueba</title>
  <meta name="homescreen-tool" content='{
    "version": 1,
    "title": "Extensión de prueba",
    "icon": "sparkles",
    "width": 340,
    "height": 420,
    "minWidth": 280,
    "minHeight": 320,
    "supportsPip": true
  }'>
  <style>
    :root {
      --bg-base: rgba(14, 15, 20, 0.94);
      --surface: rgba(255, 255, 255, 0.045);
      --surface-hover: rgba(255, 255, 255, 0.085);
      --surface-active: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --gold: #fbbf24;
      --gold-bg: rgba(251, 191, 36, 0.12);
      --gold-border: rgba(251, 191, 36, 0.35);
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 14px;
      gap: 12px;
    }

    /* Scrollbar minimalista */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    /* Header & Estado Bridge */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }

    .badge.connected {
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.1);
    }

    .badge.connected .dot {
      background-color: var(--success);
    }

    /* Botón Principal GitHub */
    .github-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 14px;
      background: var(--gold-bg);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .github-btn:hover {
      background: rgba(251, 191, 36, 0.18);
      border-color: rgba(251, 191, 36, 0.55);
      transform: translateY(-1px);
    }

    .github-btn:active {
      transform: scale(0.98);
    }

    /* Secciones Neo-Glass */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Contador Storage */
    .counter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .counter-val {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      padding: 0 6px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    /* Botones e Inputs */
    button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background: var(--surface-active);
      border-color: var(--border-strong);
    }

    button:active {
      transform: scale(0.96);
    }

    button.primary {
      background: var(--accent);
      border-color: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    button.danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-size: 12px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    /* Fallback Toast local si window.hs no está presente */
    #local-toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(24, 26, 34, 0.98);
      border: 1px solid var(--border-strong);
      color: var(--text-main);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 99px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
      white-space: nowrap;
    }

    #local-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header class="header">
    <div class="title-group">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
      <h1>Extensión de prueba</h1>
    </div>
    <span id="bridge-status" class="badge">
      <span class="dot"></span>
      <span id="bridge-text">Local</span>
    </span>
  </header>

  <!-- CTA GitHub -->
  <a id="github-link" class="github-btn" href="https://github.com/CapybaraGalaxy/HOMESCREEN" target="_blank" rel="noopener noreferrer">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
    </svg>
    <span>Da ⭐ en GitHub</span>
  </a>

  <!-- Prueba de Storage Persistente -->
  <section class="card">
    <div class="card-label">
      <span>hs.storage (Persistencia)</span>
      <span id="storage-sync">Sincronizado</span>
    </div>
    <div class="counter-row">
      <div class="counter-val" id="counter-display">0</div>
      <div class="btn-group">
        <button id="btn-dec" title="Restar">−1</button>
        <button id="btn-inc" class="primary" title="Sumar">+1</button>
        <button id="btn-reset" title="Reiniciar">Reset</button>
      </div>
    </div>
  </section>

  <!-- Prueba de Título y PiP -->
  <section class="card">
    <div class="card-label">
      <span>hs.window &amp; hs.pip</span>
    </div>
    <div class="input-row">
      <input type="text" id="custom-input" placeholder="Nuevo título o etiqueta PiP..." maxlength="28" />
    </div>
    <div class="grid-2">
      <button id="btn-title">Cambiar Título</button>
      <button id="btn-pip">Etiqueta PiP</button>
    </div>
  </section>

  <!-- Controles de Ventana y Notificaciones -->
  <section class="card">
    <div class="card-label">
      <span>Acciones del Sistema</span>
    </div>
    <div class="grid-2">
      <button id="btn-notify">Lanzar Toast</button>
      <button id="btn-resize">Alternar Tamaño</button>
    </div>
    <div class="grid-2">
      <button id="btn-minimize">Minimizar</button>
      <button id="btn-close" class="danger">Cerrar App</button>
    </div>
  </section>

  <div id="local-toast"></div>

  <script>
    (function () {
      const hasHS = typeof window.hs !== 'undefined';
      const STORAGE_KEY = 'homescreen_test_counter';
      let count = 0;
      let isExpanded = false;
      let toastTimeout = null;

      // Referencias DOM
      const bridgeStatus = document.getElementById('bridge-status');
      const bridgeText = document.getElementById('bridge-text');
      const counterDisplay = document.getElementById('counter-display');
      const storageSync = document.getElementById('storage-sync');
      const customInput = document.getElementById('custom-input');
      const localToast = document.getElementById('local-toast');

      // Inicializar estado de conexión
      if (hasHS) {
        bridgeStatus.classList.add('connected');
        bridgeText.textContent = 'Bridge Activo';
      } else {
        bridgeText.textContent = 'Modo Standalone';
      }

      // Helper unificado de notificaciones
      function notify(msg) {
        if (hasHS && typeof window.hs.notify === 'function') {
          window.hs.notify(msg);
        } else {
          localToast.textContent = msg;
          localToast.classList.add('show');
          clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => {
            localToast.classList.remove('show');
          }, 2200);
        }
      }

      // Helper unificado de almacenamiento
      async function loadCounter() {
        try {
          if (hasHS && window.hs.storage) {
            const saved = await window.hs.storage.get(STORAGE_KEY);
            count = typeof saved === 'number' ? saved : 0;
          } else {
            const saved = localStorage.getItem(STORAGE_KEY);
            count = saved !== null ? parseInt(saved, 10) || 0 : 0;
          }
        } catch (e) {
          count = 0;
        }
        updateCounterUI();
      }

      async function saveCounter(newVal) {
        count = newVal;
        updateCounterUI();
        storageSync.textContent = 'Guardando...';
        try {
          if (hasHS && window.hs.storage) {
            await window.hs.storage.set(STORAGE_KEY, count);
          } else {
            localStorage.setItem(STORAGE_KEY, String(count));
          }
          storageSync.textContent = 'Guardado ✓';
          if (hasHS && window.hs.pip && typeof window.hs.pip.setLabel === 'function') {
            window.hs.pip.setLabel(`Contador: ${count}`);
          }
        } catch (e) {
          storageSync.textContent = 'Error';
        }
      }

      function updateCounterUI() {
        counterDisplay.textContent = count;
      }

      // Eventos del Contador
      document.getElementById('btn-inc').addEventListener('click', () => saveCounter(count + 1));
      document.getElementById('btn-dec').addEventListener('click', () => saveCounter(count - 1));
      document.getElementById('btn-reset').addEventListener('click', () => {
        saveCounter(0);
        notify('Contador reiniciado a 0');
      });

      // Evento GitHub
      document.getElementById('github-link').addEventListener('click', () => {
        notify('¡Gracias por apoyar Homescreen NEO en GitHub! ⭐');
      });

      // Cambiar Título de Ventana
      document.getElementById('btn-title').addEventListener('click', () => {
        const val = customInput.value.trim() || 'Extensión de prueba ✨';
        if (hasHS && window.hs.window && typeof window.hs.window.setTitle === 'function') {
          window.hs.window.setTitle(val);
          notify(`Título actualizado: "${val}"`);
        } else {
          document.title = val;
          notify(`Título (Standalone): "${val}"`);
        }
      });

      // Actualizar Etiqueta PiP
      document.getElementById('btn-pip').addEventListener('click', () => {
        const val = customInput.value.trim() || `Test PiP (${count})`;
        if (hasHS && window.hs.pip && typeof window.hs.pip.setLabel === 'function') {
          window.hs.pip.setLabel(val);
          notify(`Etiqueta PiP enviada: "${val}"`);
        } else {
          notify(`Simulación PiP: "${val}" (Bridge no detectado)`);
        }
      });

      // Lanzar Toast de prueba
      document.getElementById('btn-notify').addEventListener('click', () => {
        notify('¡Prueba de notificación desde Homescreen NEO!');
      });

      // Alternar tamaño de ventana
      document.getElementById('btn-resize').addEventListener('click', () => {
        isExpanded = !isExpanded;
        const w = isExpanded ? 420 : 340;
        const h = isExpanded ? 480 : 420;
        if (hasHS && window.hs.window && typeof window.hs.window.setSize === 'function') {
          window.hs.window.setSize(w, h);
          notify(`Ventana redimensionada a ${w}×${h}`);
        } else {
          notify(`hs.window.setSize(${w}, ${h}) ejecutado`);
        }
      });

      // Minimizar ventana
      document.getElementById('btn-minimize').addEventListener('click', () => {
        if (hasHS && window.hs.window && typeof window.hs.window.minimize === 'function') {
          window.hs.window.minimize();
        } else {
          notify('hs.window.minimize() ejecutado');
        }
      });

      // Cerrar ventana
      document.getElementById('btn-close').addEventListener('click', () => {
        if (hasHS && window.hs.window && typeof window.hs.window.close === 'function') {
          window.hs.window.close();
        } else {
          notify('hs.window.close() ejecutado');
        }
      });

      // Carga inicial
      loadCounter();
    })();
  </script>
</body>
</html>
